<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Place Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <a href="index.html">
        <img src="images/logo.png" alt="HBnB logo" class="logo">
    </a>

    <nav>
        <a href="login.html" class="login-button">Login</a>
    </nav>
</header>

<main>
    <section id="place-details" class="place-details">
        <div class="place-info">
            <!-- Place details will be populated dynamically -->
        </div>
    </section>

    <section id="reviews">
        <h2>Reviews</h2>

        <!-- Example static review for Task 0 (JS can replace later) -->
        <article class="review-card">
            <p><strong>Jane Doe:</strong></p>
            <p>Great place to stay!</p>
            <p>Rating: ★★★★☆</p>
        </article>
    </section>

    <section id="add-review">
        <h2>Add a Review</h2>
        <form id="review-form">
            <label for="review-text">Review:</label>
            <textarea id="review-text" name="review-text" required></textarea>

            <button type="submit" class="details-button">Submit</button>
        </form>
    </section>
</main>

<footer>
    <p>All rights reserved.</p>
</footer>

<script src="scripts.js"></script>
</body>
</html>
